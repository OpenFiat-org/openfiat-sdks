name: Publish Rust crate

# Publishes the `openfiat-sdk` crate to crates.io. Separate from release.yml
# (which publishes the npm package on a `v*` tag) so the two language SDKs
# release independently: this one fires on a `rust-v*` tag.
#
# The crate's protocol dependencies must already be on crates.io — they are
# published from openfiat-core's own publish-crates.yml. The [patch.crates-io]
# in rust/Cargo.toml only affects this repo's own builds; cargo strips it from
# the uploaded crate, so downstream users get plain crates.io version deps.
on:
  push:
    tags: ["rust-v*"]
  workflow_dispatch: {}

concurrency:
  group: publish-crate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish openfiat-sdk to crates.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "openfiat-sdk version: $version"
          if [[ "${GITHUB_REF_NAME:-}" == rust-v* ]]; then
            tagver="${GITHUB_REF_NAME#rust-v}"
            if [[ "$tagver" != "$version" ]]; then
              echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2
              exit 1
            fi
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/openfiat-sdk/$version" -A 'openfiat-ci')"
          if [[ "$code" == "200" ]]; then
            echo "openfiat-sdk@$version already on crates.io, nothing to do."
            exit 0
          fi
          # --no-verify: verification would compile the crate's integration
          # tests, which pull node-internal crates (rpc/api/chain) not on
          # crates.io. The crate is built and tested in ci.yml; crates.io
          # still validates every normal dependency server-side on upload.
          cargo publish --no-verify
