[package]
name = "openfiat-sdk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Official Rust SDK for the OpenFiat protocol."
repository = "https://github.com/OpenFiat-org/openfiat-sdk-rust"
readme = "README.md"

[lib]
name = "openfiat_sdk"
path = "src/lib.rs"

[dependencies]
# Reused directly from openfiat-core rather than redefined here, so the
# SDK's request/response shapes can never drift from what a real node
# actually runs — the same reasoning as this workspace's OpenRPC
# self-description. Pinned to an exact commit since both repos are
# pre-1.0 and co-evolving (the same pattern openfiat-apps' explorer/
# indexer already uses).
openfiat-types = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-types" }
openfiat-crypto = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-crypto" }
openfiat-network = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-network" }
openfiat-serialization = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-serialization" }
openfiat-wallet = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-wallet" }
openfiat-advertisements = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-advertisements" }
openfiat-reservations = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-reservations" }
openfiat-settlement = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-settlement" }
openfiat-trade = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-trade" }
openfiat-disputes = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-disputes" }
openfiat-identity = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-identity" }
openfiat-reputation = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-reputation" }
openfiat-governance = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-governance" }
openfiat-registry = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-registry" }
openfiat-notifications = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-notifications" }
openfiat-oracles = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-oracles" }
openfiat-risk = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-risk" }
openfiat-snapshot = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-snapshot" }
openfiat-sessions = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-sessions" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# Test-only: spins up the same rpc+api server openfiat-cli runs, so the
# integration test below exercises this SDK against a real running node
# process's actual HTTP surface, not a mock.
openfiat-rpc = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-rpc" }
openfiat-api = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-api" }
openfiat-metrics = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-metrics" }
openfiat-storage = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "5aee89eae422df7bacfca7b01df755d37aa6a27b", package = "openfiat-storage" }
axum = "0.8.9"
