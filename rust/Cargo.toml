[package]
name = "openfiat-sdk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Official Rust SDK for the OpenFiat protocol."
repository = "https://github.com/OpenFiat-org/openfiat-sdk-rust"
readme = "README.md"

[lib]
name = "openfiat_sdk"
path = "src/lib.rs"

[dependencies]
# Reused directly from openfiat-core rather than redefined here, so the
# SDK's request/response shapes can never drift from what a real node
# actually runs — the same reasoning as this workspace's OpenRPC
# self-description. Pinned to an exact commit since both repos are
# pre-1.0 and co-evolving (the same pattern openfiat-apps' explorer/
# indexer already uses).
openfiat-types = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-types" }
openfiat-crypto = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-crypto" }
openfiat-network = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-network" }
openfiat-serialization = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-serialization" }
openfiat-wallet = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-wallet" }
openfiat-advertisements = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-advertisements" }
openfiat-reservations = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-reservations" }
openfiat-settlement = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-settlement" }
openfiat-trade = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-trade" }
openfiat-disputes = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-disputes" }
openfiat-identity = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-identity" }
openfiat-reputation = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-reputation" }
openfiat-governance = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-governance" }
openfiat-registry = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-registry" }
openfiat-notifications = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-notifications" }
openfiat-oracles = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-oracles" }
openfiat-risk = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-risk" }
openfiat-snapshot = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-snapshot" }
openfiat-sessions = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-sessions" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
# Solana transaction construction (OFS-4300's sendTransaction). Pinned to
# the same versions verified to compile together in openfiat-core's own
# crates/chain — the 4.x solana-client/-transaction line has an unresolved
# internal wincode version conflict; these individual crates don't pull it.
solana-transaction = { version = "3", features = ["bincode", "serde"] }
solana-message = { version = "3", features = ["bincode"] }
solana-hash = "3"
solana-signature = "3"
# `curve25519` enables `Pubkey::find_program_address` (client-side PDA
# derivation) and `borsh` implements `BorshSerialize`/`BorshDeserialize`
# on `Pubkey` itself (an instruction arg in several `onchain` builders,
# e.g. governance's `update_config_parameter`) — both needed by
# `onchain::{escrow,staking,governance}`, off by default since most
# callers of this crate never touch on-chain instructions directly.
solana-pubkey = { version = "4", features = ["curve25519", "borsh"] }
solana-keypair = "3"
solana-signer = "3"
solana-instruction = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
bincode = "1.3"
# Encodes/decodes on-chain instruction args exactly as Anchor's own
# `#[program]` macro does (it derives `AnchorSerialize`/`AnchorDeserialize`
# on top of Borsh) — this SDK has no dependency on `anchor-lang` itself
# (a much heavier dependency with its own Solana SDK version pins that
# would conflict with the pins above), so it hand-builds each
# instruction's discriminator + Borsh-encoded args directly instead.
borsh = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# Test-only: spins up the same rpc+api server openfiat-cli runs, so the
# integration test below exercises this SDK against a real running node
# process's actual HTTP surface, not a mock.
openfiat-rpc = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-rpc" }
openfiat-api = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-api" }
openfiat-metrics = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-metrics" }
openfiat-storage = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-storage" }
axum = "0.8.9"
# Test-only: talks directly to a real `solana-test-validator` for
# `tests/onchain_live_validator.rs` — proves `onchain::staking`'s
# builders produce instructions a real deployed program actually
# accepts, not just well-formed bytes. Pinned to "3" like
# `openfiat-core/crates/chain`'s own `solana-client` dependency (the 4.x
# line has an unresolved internal wincode conflict, per this crate's own
# `solana-transaction`/`solana-message` comment above).
solana-client = "4"
solana-commitment-config = "3"
# Test-only: `NodeChainMode`/`NetworkConfig` for spawning a real node in
# `RpcConnected` mode against a local `solana-test-validator`, for
# `tests/conformance_*.rs` (the full off-chain-protocol + real-on-chain-
# program proofs — see that module's own doc comment).
openfiat-chain = { git = "https://github.com/OpenFiat-org/openfiat-core", rev = "e269c9c7fd854fb7eae442260cb3611398ff5ea1", package = "openfiat-chain" }
# Test-only: `tests/conformance_dispute.rs` builds real on-chain
# `commit_dispute_vote` commitments, matching `reveal_dispute_vote`'s
# own on-chain SHA256(outcome ++ salt) verification exactly.
sha2 = "0.10"
